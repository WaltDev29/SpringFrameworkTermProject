spring.application.name=AquaMate

# Server
server.port=8080

# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Thymeleaf (disable cache in dev)
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Jackson: JSON null 필드 제외 출력
spring.jackson.default-property-inclusion=non_null

# Secret configuration
spring.profiles.include=secret

# Context path
server.servlet.context-path=/aquamate

# Database (MySQL)
spring.datasource.url=jdbc:mysql://${db.host:localhost}:${db.port:3306}/${db.name:aquamate}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=${db.username:root}
spring.datasource.password=${db.password:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.jakarta.persistence.validation.mode=none
spring.jpa.open-in-view=false
